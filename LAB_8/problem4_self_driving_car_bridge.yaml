# ROS 2 Jazzy <-> Gazebo Harmonic bridge configuration for Problem 4 (Self-Driving Car)
- ros_topic_name: "/car/cmd_vel"
  gz_topic_name: "/car/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/car/odometry"
  gz_topic_name: "/car/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/car/scan"
  gz_topic_name: "/car/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/car/camera/image_raw"
  gz_topic_name: "/car/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
