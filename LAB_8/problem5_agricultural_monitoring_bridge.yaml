# ROS 2 Jazzy <-> Gazebo Harmonic bridge configuration for Problem 5 (Agricultural Field Monitoring Robot)
- ros_topic_name: "/agribot/cmd_vel"
  gz_topic_name: "/agribot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/agribot/odometry"
  gz_topic_name: "/agribot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/agribot/scan"
  gz_topic_name: "/agribot/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/agribot/camera/image_raw"
  gz_topic_name: "/agribot/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
